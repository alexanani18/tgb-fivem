name: Discord Changelog

on:
  push:
    branches:
      - main

jobs:
  discord-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Send changelog to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TZ: Europe/Bucharest

        run: |
          PAYLOAD=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg message "$COMMIT_MESSAGE" \
            --arg url "$COMMIT_URL" \
            --arg time "$(date '+%d.%m.%Y %H:%M')" \
            '{
              username: "GitHub Changelog",
              embeds: [
                {
                  title: "🚀 Actualizare nouă",
                  color: 5763719,
                  fields: [
                    {
                      name: "📝 Commit",
                      value: $message,
                      inline: false
                    },
                    {
                      name: "👤 Autor",
                      value: $author,
                      inline: true
                    },
                    {
                      name: "🌿 Branch",
                      value: $branch,
                      inline: true
                    },
                    {
                      name: "📦 Repository",
                      value: $repository,
                      inline: false
                    },
                    {
                      name: "🔗 Commit",
                      value: "[View on GitHub](" + $url + ")",
                      inline: false
                    },
                    {
                      name: "🕒 Ora",
                      value: $time,
                      inline: false
                    }
                  ],
                  footer: {
                    text: "GitHub Changelog"
                  }
                }
              ]
            }')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
